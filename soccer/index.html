:root{--home:#1E3A63;--home-soft:rgba(30,58,99,.11);--away:#A8843F;--away-soft:rgba(168,132,63,.17)}
:root[data-theme="dark"]{--home:#8FB3E8;--home-soft:rgba(143,179,232,.15);--away:#D4AF67;--away-soft:rgba(212,175,103,.17)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--home:#8FB3E8;--home-soft:rgba(143,179,232,.15);--away:#D4AF67;--away-soft:rgba(212,175,103,.17)}}
.H{color:var(--home)}.A{color:var(--away)}.dimtxt{color:var(--dim)}
.gm-wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-bottom:30px}
.gm-row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.gm-card{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--brass);border-radius:10px;padding:14px 16px 12px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0;scroll-margin-top:12px}
.gm-ph{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.gm-num{font:500 11px var(--mono);color:var(--dim)}
.gm-title{font-family:var(--display);font-size:19px;font-weight:600;color:var(--bright)}
.gm-q{flex-basis:100%;font-size:12.5px;color:var(--dim);margin-top:-4px}
.gm-edge{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.03em}
.gm-edge.home{background:var(--home-soft);color:var(--home)}.gm-edge.away{background:var(--away-soft);color:var(--away)}
.gm-edge.even{background:var(--track);color:var(--dim)}
.gm-head{font-size:14px;line-height:1.45;color:var(--bright)}
.gm-src{font-size:11.5px;color:var(--dim);border-top:1px solid var(--border);padding-top:7px}
.gm-lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.gm-tw{overflow-x:auto;margin:0 -2px}
.gm-tw .bt-tbl{margin-bottom:0}
.bt-tbl td.r,.bt-tbl th.r{text-align:right}
.bt-tbl tr.q td:first-child{box-shadow:inset 3px 0 0 var(--green)}

/* hero: the kit's stat-card.hero, laid out as away | line | home */
.gm-hero{background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--navy-ink);border-radius:10px;box-shadow:var(--shadow);
  padding:18px 22px 12px;display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:12px 24px}
.gm-team{display:flex;flex-direction:column;gap:3px;min-width:0}
.gm-team.home{text-align:right;align-items:flex-end}
.gm-tn{font-family:var(--display);font-weight:600;font-size:38px;line-height:1}
.gm-team.away .gm-tn{color:var(--away)}.gm-team.home .gm-tn{color:var(--home)}
.gm-rec{font-size:12.5px;color:var(--dim)}
.gm-gl{font-size:12.5px;color:var(--text)}
.gm-units{display:flex;gap:18px;margin-top:6px}.gm-team.home .gm-units{justify-content:flex-end}
.gm-u{display:flex;flex-direction:column;align-items:center;min-width:56px}
.gm-u b{font-family:var(--display);font-size:24px;font-weight:600;color:var(--bright);line-height:1.05}
.gm-u span{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-top:3px}
.gm-mid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.gm-kick{font-size:12.5px;color:var(--dim)}
.gm-line{font-family:var(--display);font-size:34px;font-weight:600;color:var(--bright);line-height:1.05}
.gm-line small{display:block;font:700 10.5px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-top:5px}
.gm-wp{width:100%;max-width:360px}
.gm-wplab{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px}
.gm-wpbar{height:10px;border-radius:999px;overflow:hidden;display:flex;border:1px solid var(--border)}
.gm-wpbar i{display:block;height:100%}
.gm-story{grid-column:1/-1;display:grid;grid-template-columns:1fr 310px;gap:20px;border-top:1px solid var(--border);padding-top:12px;align-items:start}
.gm-story p{margin:0;font-size:14.5px;line-height:1.55;color:var(--bright)}
.gm-story .note{margin:0}
.gm-story .note b{display:block;font-family:var(--display);font-size:21px;font-weight:600;color:var(--bright);margin:4px 0 2px}
.gm-hfoot{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 18px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--border);padding-top:8px}

/* forecast */
.gm-card .stat-grid{margin-bottom:0;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.gm-card .stat-card{box-shadow:none;background:var(--panel)}
.gm-card .stat-val{font-size:26px}
.gm-card .stat-val.sm{font-size:19px;white-space:nowrap}
table.gm-heat{width:auto;border-collapse:separate;border-spacing:3px;margin:0 auto;background:transparent}
.gm-heat th,.gm-heat td{width:40px;height:30px;padding:0;text-align:center;border:0;border-radius:5px;font-size:12px;cursor:default;
  background:transparent;letter-spacing:0;text-transform:none;color:var(--bright)}
.gm-heat th{color:var(--dim);font-weight:600}
.gm-heat tbody tr:nth-child(even),.gm-heat tbody tr:hover{background:transparent}
.gm-ladder{display:grid;grid-template-columns:58px 1fr 54px 54px;gap:6px 10px;align-items:center;font-size:12.5px}
.gm-ladder .bar{height:14px;background:var(--track);border-radius:4px;position:relative;overflow:hidden}
.gm-ladder .bar i{position:absolute;inset:0 auto 0 0;background:var(--brass);border-radius:4px}
.gm-ladder .bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--bright);left:50%}
.gm-ladder .r{text-align:right}

/* paired rows: home bar | label | away bar */
.gm-pairhd,.gm-pair{display:grid;grid-template-columns:minmax(0,1fr) 132px minmax(0,1fr);gap:4px 12px;align-items:center}
.gm-pairhd{font-size:12.5px;font-weight:700;margin-bottom:-2px}.gm-pairhd .h{text-align:right;color:var(--home)}.gm-pairhd .a{color:var(--away)}
.gm-pair{font-size:12.5px}
.gm-pair .lb{text-align:center;font-size:11px;color:var(--dim)}
.gm-pair .hv,.gm-pair .av{display:flex;align-items:center;gap:8px}.gm-pair .hv{justify-content:flex-end}
.gm-pair .b{height:8px;border-radius:4px}.gm-pair .hv .b{background:var(--home)}.gm-pair .av .b{background:var(--away)}
.gm-pair .v{font-weight:600;color:var(--bright);min-width:44px}.gm-pair .hv .v{text-align:right}
.gm-pair .v.win{color:var(--green)}

/* units: line vs line */
.gm-lvl{display:grid;grid-template-columns:minmax(0,1fr) 60px minmax(0,1fr);gap:8px 10px;align-items:stretch}
.gm-unit{border:1px solid var(--border);border-radius:9px;padding:8px 10px;background:var(--panel);min-width:0}
.gm-unit.home{text-align:right}
.gm-unit .nm{font-weight:600;color:var(--bright);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gm-unit .ust{font-size:11.5px;color:var(--dim);margin-top:3px}
.gm-unit .cf{height:6px;border-radius:3px;background:var(--track);margin-top:6px;overflow:hidden;position:relative}
.gm-unit .cf i{position:absolute;top:0;bottom:0}
.gm-unit.home .cf i{background:var(--home);right:0}.gm-unit.away .cf i{background:var(--away);left:0}
.gm-unit.win{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.gm-slot{display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 12px var(--mono);color:var(--dim)}
.gm-slot b{font-family:var(--display);font-size:18px;font-weight:600;color:var(--bright)}
.gm-gk{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gm-gk>div{border:1px solid var(--border);border-radius:9px;padding:10px 12px;background:var(--panel)}
.gm-gk .gn{font-family:var(--display);font-size:16px;font-weight:600;color:var(--bright)}
.gm-gk .gs{font-size:11.5px;color:var(--dim);margin-top:2px}
.gm-gk .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.gm-gk .mini div{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.gm-gk .mini b{display:block;font-family:var(--display);font-size:17px;font-weight:600;color:var(--bright);text-transform:none;letter-spacing:0}
.gm-skip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--track);color:var(--dim)}
.gm-chipev{margin-left:6px;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--green);color:var(--green-on)}
.chip.active .gm-chipev{background:var(--on-navy);color:var(--navy-ink)}
.gm-jump{display:flex;flex-wrap:wrap;gap:6px}
.gm-jump .chip{font-size:11.5px;padding:3px 10px}


@media (max-width:1000px){.gm-row2{grid-template-columns:1fr}.gm-story{grid-template-columns:1fr}}
@media (max-width:760px){
  .gm-hero{grid-template-columns:1fr 1fr;padding:14px}.gm-mid{grid-column:1/-1;order:-1}.gm-tn{font-size:28px}.gm-line{font-size:28px}
  .gm-gk{grid-template-columns:1fr}.gm-pairhd,.gm-pair{grid-template-columns:minmax(0,1fr) 92px minmax(0,1fr)}
  .gm-lvl{grid-template-columns:minmax(0,1fr) 38px minmax(0,1fr)}.gm-units{gap:10px}
}
/* v0.1.3 game picker: the chips wrap onto extra rows on a wide screen (a 15-game slate no longer runs off the edge);
   on a phone they give way to one full-width row — ‹ prev · every game in a native dropdown · next › */
#gchips{flex-wrap:wrap;min-width:0}
.gm-pick{display:none;align-items:center;gap:6px;min-width:0;max-width:100%}
.gm-pick select{flex:1 1 0;width:0;min-width:0;text-overflow:ellipsis;font-size:15px;padding:8px 9px;font-weight:600}
.gm-pick .btn{padding:7px 0;width:42px;font-size:18px;line-height:1;flex-shrink:0}
.gm-pick .btn:disabled{opacity:.35;cursor:default}
.gm-pos{font:500 11.5px var(--mono);color:var(--dim);min-width:38px;text-align:center;flex-shrink:0}
@media (max-width:700px){
  .controls .gm-gamecl,#gchips{display:none}
  .gm-pick{display:flex;flex:1 1 100%;order:10}
  .controls #date{flex:1;min-width:0}
}


.hub-seg{display:inline-flex;background:var(--panel);border:1px solid var(--border2);border-radius:9px;padding:2px;gap:2px}
.hub-seg button{border:0;background:none;padding:6px 14px;border-radius:7px;color:var(--dim);font:600 13px var(--sans);cursor:pointer;white-space:nowrap}
.hub-seg button.on{background:var(--navy-ink);color:var(--on-navy)}
.hub-seg button:not(.on):hover{color:var(--bright)}
.hub-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.hub-bar .grow{flex:1}
.hub-h1{font-family:var(--display);font-size:24px;font-weight:600;color:var(--bright);line-height:1.15}
.hub-sub{font-size:12.5px;color:var(--dim);margin-top:2px;line-height:1.5}
.tb{display:inline-grid;place-items:center;min-width:42px;height:28px;padding:0 6px;border-radius:7px;font:700 12.5px var(--mono);letter-spacing:.02em;
  color:#fff;background:var(--tc,#14233A);box-shadow:inset 0 -3px 0 var(--tc2,rgba(0,0,0,.25));flex:none}
.tb.lg{min-width:58px;height:40px;font-size:16px;border-radius:10px}
.tb.sm{min-width:34px;height:22px;font-size:11px;border-radius:5px}

/* ── games board (the slate as cards) — v0.5.1: no team-colour bars; win % is a labelled number per team ── */
.gb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(318px,1fr));gap:14px}
.gc{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);cursor:pointer;
  display:flex;flex-direction:column;overflow:hidden;transition:transform .12s ease,box-shadow .12s ease,border-color .12s}
.gc:hover{transform:translateY(-2px);border-color:var(--brass);box-shadow:0 6px 18px rgba(16,28,46,.10)}
.gc.has-play{border-color:color-mix(in srgb,var(--green) 55%,var(--border))}
.gc-top{display:flex;align-items:center;gap:8px;padding:12px 14px 4px;font-size:12.5px;color:var(--dim);position:relative}
.gc-top .when{font-weight:600}
.gc-top .stat{font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--track);color:var(--dim)}
.gc-top .stat.live{background:var(--red-soft);color:var(--red)}
.gc-top .stat.final{background:var(--lb-bg);color:var(--lb-fg)}
.gc-star{margin-left:auto;background:none;border:0;font-size:17px;line-height:1;cursor:pointer;color:var(--border2);padding:2px 4px}
.gc-star.on{color:var(--brass)}
.gc-hd{display:grid;grid-template-columns:minmax(0,1fr) 46px 50px;gap:10px;padding:4px 14px 0;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.gc-hd span{text-align:right}
.gc-team{display:grid;grid-template-columns:auto minmax(0,1fr) 46px 50px;gap:10px;align-items:center;padding:6px 14px;position:relative}
.gc-tn{font-weight:600;font-size:15px;color:var(--bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-tn small{display:block;font-weight:500;font-size:11.5px;color:var(--dim);margin-top:1px}
.gc-wpct{text-align:right;font:600 15px var(--mono);color:var(--dim)}
.gc-wpct.fav{color:var(--bright)}
.gc-num{text-align:right;font-family:var(--display);font-size:26px;font-weight:600;line-height:1;color:var(--bright)}
.gc-num small{display:block;font:600 11px var(--sans);color:var(--dim);margin-top:3px}
.gc-num.fin{color:var(--bright)}.gc-num.fin.lost{color:var(--dim)}
.gc-line{display:flex;justify-content:space-between;gap:8px;padding:8px 14px 2px;font-size:12px;color:var(--dim);border-top:1px solid var(--border);margin-top:8px}
.gc-line b{font:600 12.5px var(--mono);color:var(--bright)}
.gc-mk{width:calc(100% - 28px);margin:4px 14px 2px;border-collapse:collapse;font-size:12.5px}
.gc-mk th{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);text-align:right;padding:3px 0 3px 8px;background:none;border:0;cursor:default}
.gc-mk th:first-child{text-align:left;padding-left:0}
.gc-mk td{padding:3px 0 3px 8px;text-align:right;font-family:var(--mono);color:var(--text);border:0;white-space:nowrap}
.gc-mk td:first-child{text-align:left;padding-left:0;font-family:var(--sans);font-weight:600;color:var(--bright)}
.gc-mk tbody tr{cursor:pointer;background:none!important}
.gc-mk .d.pos{color:var(--green);font-weight:600}.gc-mk .d.neg{color:var(--red);font-weight:600}
.gc-foot{margin-top:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px 12px;font-size:12px;color:var(--dim)}
.gc-foot .gk{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-foot .gk b{color:var(--text);font-weight:600}
.gc-play{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--green);color:var(--green-on);white-space:nowrap}
.gc-lean{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--track);color:var(--dim);white-space:nowrap}
.gb-empty{grid-column:1/-1}

/* ── matchup (one game) ── */
.mu-top{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.mu-top .pos{font:600 12.5px var(--mono);color:var(--dim)}
.mu-hero-teams .tb{margin-bottom:6px}
.ovm{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ovm-c{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:0}
.ovm-h{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.ovm-n{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 6px}
.ovm-n div{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.ovm-n b{display:block;font-family:var(--display);font-size:24px;font-weight:600;color:var(--bright);letter-spacing:0;text-transform:none;line-height:1.1;margin-top:2px}
.ovm-n b.pos{color:var(--green)}.ovm-n b.neg{color:var(--red)}
.ovm-q{font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--text)}
.ovm-q span b{font-family:var(--mono);font-weight:600}
.ovm-q .dimtxt{font-size:11.5px}
.pw{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pw-t{display:flex;flex-direction:column;gap:6px;min-width:0}
.pw-row{display:grid;grid-template-columns:minmax(0,1fr) 54px 74px 70px;gap:8px;align-items:center;padding:6px 8px;border-radius:8px;
  background:var(--panel);border:1px solid var(--border);cursor:pointer;font-size:13px}
.pw-row:hover{border-color:var(--brass)}
.pw-row .nm{font-weight:600;color:var(--bright);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pw-row .nm small{display:block;font-weight:500;font-size:11.5px;color:var(--dim)}
.pw-row .v{text-align:right;font:600 15px var(--display);color:var(--bright)}
.pw-row .ln{text-align:right;font:500 12px var(--mono);color:var(--dim)}
.pw-row .ev{text-align:right}
.pw-row.g{border-left:3px solid var(--brass)}
.hp ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.5;color:var(--bright)}
.hp li::marker{color:var(--brass)}

/* ── players ── */
#pl-wrap tbody tr td:first-child{min-width:190px}
.pl-cards{display:none}
.plc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:11px 12px;border-bottom:1px solid var(--border);background:var(--surface);cursor:pointer}
.plc.sel{background:var(--accent-soft);box-shadow:inset 4px 0 0 var(--brass)}
.plc.has-ev{box-shadow:inset 4px 0 0 var(--green)}
.plc .nm{font-weight:600;font-size:15px;color:var(--bright)}
.plc .mt{font-size:12px;color:var(--dim)}
.plc .pj{text-align:right;font:600 22px var(--display);color:var(--bright);line-height:1}
.plc .pj small{display:block;font:600 10.5px var(--sans);color:var(--dim);letter-spacing:.05em;margin-top:3px}
.plc .ln{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--text);align-items:center}
.plc .ln b{font-family:var(--mono)}

/* ── open plays (v0.5.1) ── */
.tabn{display:none;margin-left:6px;min-width:18px;padding:0 6px;border-radius:999px;background:var(--green);color:var(--green-on);
  font:700 10.5px/17px var(--sans);text-align:center;vertical-align:1px;letter-spacing:0}
.ost{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:999px;background:var(--track);color:var(--dim);white-space:nowrap}
.ost.live{background:var(--red-soft);color:var(--red)}
.ost.final{background:var(--lb-bg);color:var(--lb-fg)}
.ost.stale{background:var(--yellow-soft);color:var(--yellow)}
.op-tbl tbody tr{cursor:pointer}
.op-tbl tbody tr:hover{background:var(--hover)}
.op-tbl td{vertical-align:top}
.op-tbl .tb.sm{vertical-align:middle}
.op-pick{color:var(--bright);font-weight:600}
.op-cards{display:none}
.opc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;font-size:13px;box-shadow:var(--shadow)}
.opc-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.opc-top .ev{margin-left:auto}
.opc-pick{font-weight:600;color:var(--bright);font-size:14px}
.opc-px{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--text)}
.opc-px .k{color:var(--dim)}

/* ── results ── */
.ov-models{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:18px}
.ovc{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);border-top:3px solid var(--mc,var(--brass));cursor:pointer}
.ovc:hover{border-color:var(--brass)}

<script>
const API = location.pathname.replace(/\/[^\/]*$/, '');
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isNum = x => typeof x === 'number' && isFinite(x);
const pct = (p, d = 1) => isNum(p) ? (100 * p).toFixed(d) + '%' : '—';
const f = (x, d = 2) => isNum(x) ? Number(x).toFixed(d) : '—';
const am = p => { if (!isNum(p) || p <= 0 || p >= 1) return '—'; const a = p >= .5 ? -100 * p / (1 - p) : 100 * (1 - p) / p; return (a > 0 ? '+' : '') + Math.round(a); };
const dec = p => isNum(p) && p > 0 ? (1 / p).toFixed(2) : '—';
const ko = s => new Date(s).toLocaleString([], {weekday: 'short', hour: '2-digit', minute: '2-digit'});
const dayKey = s => new Date(s).toLocaleDateString([], {weekday: 'short', month: 'short', day: 'numeric'});
const store = { get: (k, d) => { try { return JSON.parse(localStorage.getItem('pitchside-' + k)) ?? d; } catch (e) { return d; } },
                set: (k, v) => { try { localStorage.setItem('pitchside-' + k, JSON.stringify(v)); } catch (e) {} } };
const STATS = [['shots','Shots'],['sot','Shots on target'],['goals','Goals'],['assists','Assists'],['tackles','Tackles'],['fouls','Fouls'],['yellows','Cards'],['saves','Saves']];

// ── math: Dixon-Coles scoreline matrix, negative binomial ─────────────────────
function pois(k, l) { let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; }
function matrix(lh, la, rho, n = 11) {
  const m = []; let s = 0;
  for (let i = 0; i < n; i++) { m.push([]); for (let j = 0; j < n; j++) {
    let p = pois(i, lh) * pois(j, la);
    if (i === 0 && j === 0) p *= 1 - lh * la * rho; else if (i === 0 && j === 1) p *= 1 + lh * rho;
    else if (i === 1 && j === 0) p *= 1 + la * rho; else if (i === 1 && j === 1) p *= 1 - rho;
    p = Math.max(p, 0); m[i].push(p); s += p; } }
  return m.map(r => r.map(p => p / s));
}
function mk(m) {
  let h = 0, d = 0, a = 0, bt = 0; const tot = {}, hc = {};
  for (let i = 0; i < m.length; i++) for (let j = 0; j < m.length; j++) {
    const p = m[i][j]; if (i > j) h += p; else if (i === j) d += p; else a += p;
    if (i > 0 && j > 0) bt += p; tot[i + j] = (tot[i + j] || 0) + p; hc[i - j] = (hc[i - j] || 0) + p; }

function markets(sc) {
  const m = sc.m, H = M.teams.home.name, A = M.teams.away.name, out = [[H + ' win', m.h], ['Draw', m.d], [A + ' win', m.a], ['Both teams score', m.btts]];
  [1.5, 2.5, 3.5].forEach(L => out.push([`Over ${L} goals`, m.over(L)], [`Under ${L} goals`, 1 - m.over(L)]));
  if (isNum(sc.ch)) [8.5, 9.5, 10.5, 11.5].forEach(L => { const p = nbSf(L, sc.ch + sc.ca, M.counts.corners.r_total); out.push([`Over ${L} corners`, p], [`Under ${L} corners`, 1 - p]); });
  for (const s of ['home', 'away']) { const calc = s === 'home' ? sc.H : sc.A;
    for (const p of M.teams[s].players.filter(p => XI[s].has(p.id))) { const mu = calc.mu(p);
      for (const [k, lab, L] of [['shots', 'shots', 1.5], ['sot', 'shots on target', 0.5], ['goals', 'to score', 0.5], ['tackles', 'tackles', 1.5]]) {
        if (!isNum(mu[k])) continue; const r = (M.nb_r || {})[k]; out.push([`${p.name} ${k === 'goals' ? lab : 'over ' + L + ' ' + lab}`, nbSf(L, mu[k], r)]); } } }
  return out;
}
let EVM = [];
function evalCard(sc) {
  EVM = markets(sc);
  return sec('eval', 'Price a line', 'type a book\'s price, see the EV against this page\'s numbers', '',
    `<div class="evrow"><select id="ev-mk">${EVM.map((x, i) => `<option value="${i}">${esc(x[0])}</option>`).join('')}</select><input id="ev-px" placeholder="−110 or 1.91"/><button class="btn" id="ev-go">PRICE IT</button></div><div class="evout" id="ev-out" style="margin-top:8px;font-size:13px"></div>`,
    'Model probability only, no market anchor. Data mode: nothing here is a bet.');
}
function evaluate() {
  const [lab, p] = EVM[+$('ev-mk').value]; let d = parseFloat($('ev-px').value.trim());
  if (!isFinite(d)) { $('ev-out').textContent = 'Type a price: American (−110, +150) or decimal (1.91).'; return; }
  if (Math.abs(d) >= 100) d = d > 0 ? d / 100 + 1 : 100 / Math.abs(d) + 1;
  const ev = (p * d - 1) * 100;
  $('ev-out').innerHTML = `<b>${esc(lab)}</b> at ${d.toFixed(2)}: model ${pct(p)}, book implies ${pct(1 / d)} → EV <b class="${ev >= 5 ? 'good' : ev < 0 ? 'bad' : ''}">${ev.toFixed(1)}%</b>`;
}
function engineCard() {
  const lf = M.lineup_fit || {};
  const rows = Object.entries(lf).map(([k, v]) => `<tr><td>${k}</td><td class="r">${f(v.beta, 3)}</td><td class="r">${v.n_test}</td><td class="r">${v.improves ? 'yes' : 'no'}</td></tr>`).join('');
  return sec('engine', 'How the selector works', 'fitted on past XIs, tested on 2023-07 onward', '',
    `<div class="gm-row2"><div style="font-size:13px;line-height:1.55">Each starter brings a pregame contribution: expected minutes × his shrunk per-90 rate. A team's <b>attack strength</b> is
      its XI's total against the probable XI's. The fitted <b>beta</b> says how much of a change reaches the team total: <b>team total × strength<sup>beta</sup></b>; the rest
      is absorbed by teammates, whose own projections scale by strength<sup>beta − 1</sup>. Beta 1 would mean a missing player's output vanishes with him; beta 0 that teammates replace all of it.
      The opponent's lineup does not move the other side's numbers yet (no defensive player rating good enough).</div>
      <table class="mini"><thead><tr><th>STAT</th><th class="r">BETA</th><th class="r">TEST TEAM-MATCHES</th><th class="r">BEATS NO-LINEUP</th></tr></thead><tbody>${rows}</tbody></table></div>`, '');
}

// ── Players tab ───────────────────────────────────────────────────────────────
const PS = {stat: 'shots', mkt: false}; let PD = null;
$('p-stat').innerHTML = STATS.map(([k, l]) => `<div class="chip ${k === 'shots' ? 'active' : ''}" data-k="${k}">${l.toUpperCase()}</div>`).join('');
document.querySelectorAll('#p-stat .chip').forEach(c => c.onclick = () => { document.querySelectorAll('#p-stat .chip').forEach(x => x.classList.toggle('active', x === c)); PS.stat = c.dataset.k; PD = null; loadPlayers(); });
$('p-lg').onchange = renderPlayers; $('p-q').oninput = renderPlayers;
$('p-mkt').onclick = () => { PS.mkt = !PS.mkt; $('p-mkt').classList.toggle('active', PS.mkt); renderPlayers(); };
async function loadPlayers() { if (PD && PD.stat === PS.stat) return renderPlayers(); try { PD = await (await fetch(`${API}/api/hub/players?stat=${PS.stat}`)).json(); } catch (e) { PD = {players: []}; } renderPlayers(); }
function renderPlayers() {
  if (!PD) return; const lg = $('p-lg').value, q = $('p-q').value.toLowerCase();
  const rows = PD.players.filter(p => (!lg || p.league_name === lg) && (!PS.mkt || p.props_market) && (!q || (p.name + ' ' + p.team + ' ' + p.opp).toLowerCase().includes(q)));
  $('p-n').innerHTML = `<span>${rows.length}</span> PROBABLE STARTERS`;
  const lines = PD.lines || [];
  $('p-view').innerHTML = rows.length ? `<div class="gm-tw"><table class="bt-tbl"><thead><tr><th>PLAYER</th><th>MATCH</th><th>KICKOFF</th><th class="r">PROJ</th>${lines.map(L => `<th class="r">O ${L}<br><small>fair</small></th>`).join('')}</tr></thead><tbody>
    ${rows.slice(0, 600).map(p => `<tr data-g="${p.event_id}" style="cursor:pointer"><td><b>${esc(p.name)}</b> <span class="dimtxt">${esc(p.pos || '')}</span></td><td>${esc(p.team)} <span class="dimtxt">${p.side === 'home' ? 'v' : '@'}</span> ${esc(p.opp)}<div class="dimtxt" style="font-size:11px">${esc(p.league_name)}</div></td>
      <td class="dimtxt">${ko(p.date_utc)}</td><td class="r"><b>${f(p.mu, 2)}</b></td>${lines.map(L => `<td class="r">${pct(p.over[L], 0)}<br><small class="dimtxt">${am(p.over[L])}</small></td>`).join('')}</tr>`).join('')}</tbody></table></div>`
    : '<div class="empty">No players match.</div>';
  $('p-view').querySelectorAll('tr[data-g]').forEach(tr => tr.onclick = () => go('game/' + tr.dataset.g));
}

// ── Results tab (the classic page's renderer) ─────────────────────────────────
let RES = null;
async function loadResults() {
  if (RES) return;
  try { RES = await (await fetch(`${API}/api/results`)).json(); } catch (e) { $('r-view').innerHTML = '<div class="empty">RESULTS UNAVAILABLE</div>'; return; }
  const r = RES, g = r.games, bt = r.backtest_games || {}, bc = r.backtest_counts || {};
  const sc = (l, v, s, cls = '') => `<div class="stat-card ${cls}"><div class="stat-label">${l}</div><div class="stat-val">${v}</div><div class="stat-sub">${s || ''}</div></div>`;
  let h = `<div class="nb"><b>No bets, no units yet.</b> ${esc(r.note)} Units up or down start once odds are approved and the models are priced against books.</div>`;
  h += `<div class="section-hdr">Game lines · graded projections</div>`;
  if (g) {
    h += `<div class="stat-grid">${sc('MATCHES GRADED', g.n, 'first projection of each fixture')}${sc('1X2 LOG LOSS', f(g.logloss, 4), 'lower is better · Pinnacle close ran 0.961 in the backtest')}
      ${sc('BRIER', f(g.brier, 4), '1X2')}${sc('FAVOURITE HIT', pct(g.pick_hit), 'model\'s most likely result')}${sc('DRAWS', pct(g.draw_rate), `model said ${pct(g.p_draw_mean)}`)}${sc('OVER 2.5', pct(g.over25_rate), `model said ${pct(g.p_over25_mean)}`)}</div>`;
    const cal = (t, rows) => `<div><div class="dsl">${t}</div><table class="mini"><thead><tr><th>MODEL P</th><th class="r">N</th><th class="r">PREDICTED</th><th class="r">ACTUAL</th></tr></thead><tbody>${rows.map(x => `<tr><td>${x.bucket}</td><td class="r">${x.n}</td><td class="r">${pct(x.pred)}</td><td class="r">${pct(x.act)}</td></tr>`).join('')}</tbody></table></div>`;
    h += `<div class="two-col">${cal('CALIBRATION · HOME WIN', g.calib_home)}${cal('CALIBRATION · OVER 2.5', g.calib_over25)}</div>`;
    h += `<div class="dsl" style="margin-top:16px">RECENT</div><table class="mini"><thead><tr><th>MATCH</th><th class="r">SCORE</th><th class="r">H / D / A</th><th class="r">PICK</th><th class="r">O2.5</th></tr></thead><tbody>${g.recent.map(x => `<tr><td>${esc(x.home_team)} v ${esc(x.away_team)}</td><td class="r">${x.home_score}–${x.away_score}</td><td class="r">${pct(x.p_home, 0)} / ${pct(x.p_draw, 0)} / ${pct(x.p_away, 0)}</td><td class="r ${x.pick === x.result ? 'good' : ''}">${x.pick}</td><td class="r">${pct(x['p_over_2.5'], 0)}</td></tr>`).join('')}</tbody></table>`;
  } else h += `<div class="empty">No graded fixtures yet · the daily job grades each morning.</div>`;
  h += `<div class="section-hdr">Corners · cards · goal kicks · graded projections</div>`;
  h += r.counts && Object.keys(r.counts).length ? '<div class="two-col">' + Object.entries(r.counts).map(([s, v]) => `<div><div class="dsl">${s.replace('_', ' ').toUpperCase()} · ${v.n} MATCHES · ACTUAL ${f(v.mean_act, 2)} / PROJECTED ${f(v.mean_proj, 2)}</div><table class="mini"><thead><tr><th>LINE</th><th class="r">MODEL P(OVER)</th><th class="r">ACTUAL</th></tr></thead><tbody>${v.lines.map(x => `<tr><td>over ${x.line}</td><td class="r">${pct(x.p_model)}</td><td class="r">${pct(x.act)}</td></tr>`).join('')}</tbody></table></div>`).join('') + '</div>' : '<div class="empty">No graded fixtures yet.</div>';
  h += `<div class="section-hdr">Backtests · model accuracy, not bets</div>`;
  const t = bt.test_2023_on;
  if (t) h += `<div class="stat-grid">${sc('1X2 · TEST 2023-07 ON', f(t.logloss_model, 4), `${t.n} matches · Pinnacle open ${f(t.logloss_pin_open, 4)} · close ${f(t.logloss_pin_close, 4)}`)}
    ${sc('SIMULATED BETS (TEST)', `${t.bets.units > 0 ? '+' : ''}${f(t.bets.units, 1)}u`, `${t.bets.bets} bets · ROI ${f(t.bets.roi_pct, 1)}% · best opening price, 5% EV`, t.bets.units < 0 ? 'cold' : '')}
    ${sc('VERDICT', 'no 1X2 edge', 'the market knows more; the game model feeds game state to props and counts')}</div>`;
  const cr = Object.entries(bc).filter(([k]) => k.endsWith('test_2023_on') || k.startsWith('goal_kicks'));
  if (cr.length) h += `<table class="mini"><thead><tr><th>STAT · SPLIT</th><th class="r">MATCHES</th><th class="r">TEAM NB LOG LOSS · MODEL / BASELINE</th><th class="r">ACTUAL / PREDICTED</th></tr></thead><tbody>${cr.map(([k, v]) => `<tr><td>${k}</td><td class="r">${v.n_matches}</td><td class="r">${v.nb_logloss_team_model} / ${v.nb_logloss_team_baseline}</td><td class="r">${v.match_total_mean} / ${v.match_total_pred_mean}</td></tr>`).join('')}</tbody></table>`;
  h += `<div class="nb" style="margin-top:16px">Player props: graded projections and the backtest are on the <a href="props/">props board</a> → Results.</div>`;
  $('r-view').innerHTML = h;
}

loadGames();
</script>
