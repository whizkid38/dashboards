<script>
/* wk-snap.js — injected into every board page by wk_site.py (do not load it directly).
   The page's own code is untouched: its fetch(API + "/api/…") calls are answered from snap/ files saved on the
   last run. GET → the saved response (same status as the Pi gave); anything that writes → a read-only error;
   an API call that was not saved → a 404 with a message. Calls to other sites pass straight through. */
(function () {
  var S = window.__WK_SNAP = {"v":"be4fe9312305","files":{"api/weather":["snap/api_weather-fbfcc744.json",200,"application/json"],"api/health":["snap/api_health-083f73b2.json",200,"application/json"]},"root":"../","name":"Game-Day Weather","abs":false,"eval":null,"noq":[],"derive":[],"msg_ro":"Read-only snapshot. Pulls, grading and edits run on the Pi.","msg_missing":"Not in the public snapshot. This view runs live on the Pi."};
  if (!S || !window.fetch) return;
  var dir = location.pathname.replace(/[^\/]*$/, '');          // the board's folder, e.g. /whizkid-site/nfl/
  var real = window.fetch.bind(window);

  function keyOf(u) {
    var rel;
    if (u.pathname.indexOf(dir) === 0) rel = u.pathname.slice(dir.length).replace(/^\/+/, '');
    else if (S.abs && u.pathname.indexOf('/api/') === 0) rel = u.pathname.slice(1);   // pages that call "/api/…"
    else return null;
    try { rel = decodeURIComponent(rel); } catch (e) {}
    if (!/^([A-Za-z0-9_-]+\/)?api\//.test(rel)) return null;                  // api/… or e.g. saves/api/… (hub pages)
    for (var i = 0; i < (S.noq || []).length; i++) if (rel.indexOf(S.noq[i]) === 0) return rel;   // player cards: path only
    var ps = [];
    u.searchParams.forEach(function (v, k) { ps.push([k, v]); });
    ps.sort(function (a, b) { return a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : (a[1] < b[1] ? -1 : a[1] > b[1] ? 1 : 0); });
    return rel + (ps.length ? '?' + ps.map(function (p) { return p[0] + '=' + p[1]; }).join('&') : '');
  }
  function json(obj, status) {
    return new Response(JSON.stringify(obj), {status: status, headers: {'Content-Type': 'application/json'}});
  }

  // ── "evaluate a line": the Pi's own probability at each line (snap/evaluator.json), your price priced here ──
  var EV = null;
  function dec(o) { return o > 0 ? 1 + o / 100 : 1 + 100 / Math.abs(o); }
  function implied(o) { return o > 0 ? 100 / (o + 100) : Math.abs(o) / (Math.abs(o) + 100); }
  function american(p) { if (!(p > 0 && p < 1)) return null; return p >= 0.5 ? Math.round(-100 * p / (1 - p)) : Math.round(100 * (1 - p) / p); }
  function evaluate(u) {
    var q = u.searchParams, fail = function (m) { return json({error: m}, 400); };
    if (q.get('period')) return Promise.resolve(fail('On the public copy, Evaluate a line works on the latest period only.'));
    var load = EV ? Promise.resolve(EV) : real(dir + S.eval + '?v=' + S.v, {cache: 'no-cache'}).then(function (r) { return r.json(); }).then(function (d) { return (EV = d); });
    return load.then(function (E) {
      var P = E.players[String(q.get('player'))];
      if (!P) return fail('No line ladder for this player in the public copy (not on the latest projections).');
      var ln = Math.round(parseFloat(q.get('line')) * 2) / 2, g = P.g[String(ln)];
      if (!g) { var ks = Object.keys(P.g).map(Number).sort(function (a, b) { return a - b; });
        return fail('The public copy prices ' + ks[0] + '–' + ks[ks.length - 1] + (E.kelly === 'cond' ? ' (half lines)' : '') + ' for this player; ' + ln + ' is outside it.'); }
      var po = g[0], pu = g[1], pp = g[2] || 0, nb = (P.nb || {})[String(ln)];
      var bar = (E.single && nb === 1) ? E.single : E.bar;
      var over = parseInt(q.get('over'), 10), under = parseInt(q.get('under'), 10);
      var sides = [['over', over, po, pu], ['under', under, pu, po]].map(function (x) {
        var pw = x[2], pl = x[3], o = x[1], s = {side: x[0], p_win: pw, p_lose: pl, fair: american(pw / Math.max(pw + pl, 1e-9)), odds: isNaN(o) ? null : o};
        if (isNaN(o) || o === 0 || Math.abs(o) < 100) return s;
        var b = dec(o) - 1, ev = (pw * b - pl) * 100, k;
        if (E.kelly === 'cond') { var p = pw / Math.max(pw + pl, 1e-12); k = Math.max(0, (p * b - (1 - p)) / b) * E.kf * 100; }
        else k = Math.max(0, (b * pw - pl) / b * E.kf) * 100;
        s.ev = ev; s.kelly_pct = Math.min(k, E.cap_pct); s.implied = implied(o);
        var fl = [];
        if (E.max_ev != null && ev > E.max_ev) fl.push({block: true, text: 'Over the ' + E.max_ev + '% sanity cap. Edges this big are usually a wrong line, a wrong player or stale news, so the pipeline skips them. Check before betting.'});
        if (E.kelly === 'cond' && !P.lam_k) fl.push({block: true, text: "No market λ for this player yet. The pipeline won't bet a model-only number."});
        if (E.sport === 'saves' && P.status && P.status !== 'Confirmed') fl.push({block: false, text: 'Starter is ' + P.status + ", not confirmed. A goalie who doesn't start is usually a void, but check your book's rule."});
        if (E.sport === 'shots' && P.status && /\b(out|scratch|scratched|ir|ltir|gtd|questionable|doubtful|dtd|unconfirmed)\b/i.test(P.status)) fl.push({block: false, text: 'Lineup status is ' + P.status + ". Make sure he's playing before you bet."});
        if (E.single && E.bar <= ev && ev < E.single) fl.push({block: false, text: 'Clears ' + E.bar + '%, but when only one book hangs this line the pipeline wants ' + E.single + '%.'});
        s.flags = fl;
        return s;
      });
      var notes = (P.notes || []).concat(E.notes || []);
      notes.push('Public copy: model probabilities from the Pi as of ' + new Date(E.built_at).toLocaleString() + (E.kelly === 'cond' ? '; the star-under and model-side rules are only checked on the Pi.' : '.'));
      return json({line: ln, sides: sides, bar: bar, lam_label: P.lam_label, p_push: pp, notes: notes,
                   hold_pct: (!isNaN(over) && !isNaN(under)) ? (implied(over) + implied(under) - 1) * 100 : null}, 200);
    }).catch(function () { return fail('The public copy could not load its line ladder.'); });
  }

  window.fetch = function (input, init) {
    var url = typeof input === 'string' ? input : (input && input.url) || String(input);
    var method = String((init && init.method) || (input && input.method) || 'GET').toUpperCase();
    var u;
    try { u = new URL(url, location.href); } catch (e) { return real(input, init); }
    if (u.origin !== location.origin) return real(input, init);
    var k = keyOf(u);
    if (k === null) return real(input, init);
    if (method !== 'GET' && method !== 'HEAD')
      return Promise.resolve(json({error: S.msg_ro, ok: false, started: false, readonly: true}, 403));
    if (S.eval && k.indexOf('api/wk/evaluate') === 0) return evaluate(u);
    // derive: one item out of a saved bigger answer, e.g. api/matchup?date=D&id=X  ←  api/matchups?date=D → games[X]
    for (var di = 0; di < (S.derive || []).length; di++) {
      var D = S.derive[di];
      if (k.split('?')[0] !== D.path || S.files[k]) continue;
      var keep = (D.keep || []).map(function (p) { return [p, u.searchParams.get(p) || '']; }).filter(function (x) { return x[1]; });
      keep.sort(function (a, b) { return a[0] < b[0] ? -1 : 1; });
      var src = D.from + (keep.length ? '?' + keep.map(function (x) { return x[0] + '=' + x[1]; }).join('&') : '');
      var sh = S.files[src], id = u.searchParams.get(D.by || 'id');
      if (!sh) break;
      return real(dir + sh[0] + '?v=' + S.v, {cache: 'no-cache'}).then(function (r) { return r.json(); }).then(function (all) {
        var coll = (D.pick || '').split('.').filter(Boolean).reduce(function (o, p) { return o ? o[p] : null; }, all);
        var item = coll && (Array.isArray(coll) ? coll.filter(function (g) { return String(g[D.match || 'id']) === String(id); })[0] : coll[id]);
        return item ? json(item, 200) : json({error: id + ' is not in the public snapshot for that day.'}, 404);
      }).catch(function () { return json({error: S.msg_missing}, 404); });
    }
    var hit = S.files[k];
    if (!hit) {
      (S.misses = S.misses || []).push(k);
      if (window.console) console.info('[wk-snap] not in the snapshot:', k);
      return Promise.resolve(json({error: S.msg_missing, readonly: true}, 404));
    }
    return real(dir + hit[0] + '?v=' + S.v, {cache: 'no-cache'}).then(function (r) {
      if (!r.ok) return json({error: 'Snapshot file missing (' + r.status + ')'}, 404);
      return r.blob().then(function (b) {
        return new Response(b, {status: hit[1] || 200, headers: {'Content-Type': hit[2] || 'application/json'}});
      });
    });
  };
})();

</script>

/* ═══════════════════════════════════════════════════════════════════════
   Whizkid Automations — "Ledger" theme, same chrome as WhizShap / Hawkey.
   Light by default, navy night on request (◐ button, remembered per
   browser under the shared 'wk-theme' key).

   Weather severity colours are their own family and never share a hue
   with the brand: brass appears only in the header bar and tab underline,
   never inside the game grid. Each tier has two shades per theme:
     --yellow/--orange/--red/--deepred  stripes, dots, wind arrows, fills
     --*-ink                            text, tuned for contrast on cards
   Light mode needs darker inks than dark mode (yellow text on white is
   unreadable), which is why the inks are separate tokens.
   ═══════════════════════════════════════════════════════════════════════ */




*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,select{font-family:var(--sans)}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;min-height:100vh;
  display:flex;flex-direction:column;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}

/* ── header: Whizkid Automations brand bar — identical to WhizShap ──── */



header{flex-shrink:0;height:62px;display:flex;align-items:center;gap:12px;padding:0 22px;position:sticky;top:0;
  background:var(--hdr-bg);color:var(--hdr-text);border-bottom:3px solid var(--brass-hi);z-index:50}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit;min-width:0}
.wk-badge{display:block;flex-shrink:0;width:40px;height:40px}
.logo{font-family:var(--display);font-weight:600;font-size:25px;letter-spacing:-.01em;color:var(--hdr-text);line-height:1;white-space:nowrap}
.logo b{font-weight:600;color:var(--brass-hi)}
.hd{font-size:11px;margin-top:4px;color:var(--hdr-dim);letter-spacing:.06em;text-transform:uppercase;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--hdr-text);
  background:transparent;border:1px solid rgba(244,239,228,.25);border-radius:7px;padding:6px 10px;
  text-decoration:none;cursor:pointer;white-space:nowrap}
.hbtn:hover{border-color:var(--brass-hi);color:#fff}
.hbtn:disabled{opacity:.5;cursor:default}
.hbtn.spinning svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── tabs ─────────────────────────────────────────────────────────── */
nav{flex-shrink:0;display:flex;gap:4px;border-bottom:1px solid var(--border);background:var(--surface);padding:0 22px;
  overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.tab{font-size:14.5px;font-weight:600;padding:12px 16px 10px;cursor:pointer;color:var(--dim);background:none;border:none;
  border-bottom:3px solid transparent;user-select:none;white-space:nowrap}
.tab:hover{color:var(--bright)}
.tab.active{color:var(--bright);border-bottom-color:var(--brass)}
.tab-count{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:999px;font-size:11.5px;font-weight:600;
  line-height:18px;text-align:center;background:var(--hover);color:var(--dim)}
.tab.active .tab-count{color:var(--bright)}

/* ── control bar ──────────────────────────────────────────────────── */
.controls{flex-shrink:0;display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:10px 22px;
  border-bottom:1px solid var(--border);background:var(--panel)}
select,input[type=text]{font-size:13.5px;color:var(--bright);background:var(--card);border:1px solid var(--border2);
  border-radius:7px;padding:6px 9px;outline:none}
select:focus,input:focus{border-color:var(--brass);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=text]{width:200px}
input[type=checkbox]{accent-color:var(--bright)}
.controls label{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.legend{margin-left:auto;display:flex;gap:6px 12px;font-size:12.5px;color:var(--text);flex-wrap:wrap}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.status-banner{font-size:13px;font-weight:600;color:var(--red-ink);background:var(--red-wash);
  border-bottom:1px solid var(--red);padding:9px 22px;display:none}
.status-banner.show{display:block}

/* ── game grid ────────────────────────────────────────────────────── */
main{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:16px;padding:20px 22px 28px}
.empty{grid-column:1/-1;padding:60px 22px;text-align:center;color:var(--dim)}
.day-header{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;font-family:var(--display);font-weight:600;
  font-size:21px;color:var(--bright);border-bottom:1px solid var(--border);padding:8px 0 6px;margin-top:8px}
.day-header:first-child{margin-top:0;padding-top:0}
.day-header small{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--dim)}
.kickoff{white-space:nowrap}

/* Severity stripe: 5px left border in the tier colour. */
.game-card{background:var(--card);border:1px solid var(--border);border-left:5px solid var(--border2);border-radius:10px;
  overflow:hidden;box-shadow:var(--shadow);transition:transform .15s}
.game-card:hover{transform:translateY(-2px)}
.game-card.sev-1{border-left-color:var(--yellow)}
.game-card.sev-2{border-left-color:var(--orange)}
.game-card.sev-3{border-left-color:var(--red)}
.game-card.sev-4{border-left-color:var(--deepred)}
.game-card.sev-5{border-left-color:var(--red);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(0,0,0,0)}50%{box-shadow:0 0 12px var(--pulse)}}

.card-head{padding:13px 16px 10px;border-bottom:1px solid var(--border)}
.matchup{font-size:15.5px;font-weight:600;color:var(--bright)}
.venue-line{font-size:12.5px;color:var(--dim);margin-top:3px;display:flex;justify-content:space-between;gap:8px}
/* Live game (2026-10-08): pulsing dot + game state, in the card head. */
.live-chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;
  color:var(--red-ink);background:var(--red-wash);border-radius:999px;padding:1px 8px 1px 7px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.live-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);animation:livepulse 1.4s infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.live-chip::before{animation:none}}
.level-chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--dim);
  border:1px solid var(--border2);border-radius:4px;padding:0 6px;margin-left:8px;vertical-align:2px}

.card-body{padding:12px 16px 14px}
.snapshot{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-bottom:10px}
.snapshot .chip{color:var(--bright)}
.snapshot .chip b{color:var(--dim);font-weight:500}

/* Tier rows: stripe + wash in the tier colour; label text uses the ink
   shade. Heavy is a solid deep-red pill with white text in both themes. */
.tier-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.tier-row{border-radius:6px;padding:6px 10px;background:var(--zebra);border-left:4px solid var(--border2)}
.tier-row .tier-badge-inline{font-size:12.5px;font-weight:700}
.tier-row .tier-impact{font-size:12.5px;color:var(--text);margin-top:2px;line-height:1.4}
.tier-row.r1{border-left-color:var(--yellow);background:var(--yellow-wash)} .tier-row.r1 .tier-badge-inline{color:var(--yellow-ink)}
.tier-row.r2{border-left-color:var(--orange);background:var(--orange-wash)} .tier-row.r2 .tier-badge-inline{color:var(--orange-ink)}
.tier-row.r3{border-left-color:var(--red);background:var(--red-wash)} .tier-row.r3 .tier-badge-inline{color:var(--red-ink)}
.tier-row.r4{border-left-color:var(--deepred);background:var(--deepred-wash)}
.tier-row.r4 .tier-badge-inline{color:#fff;background:var(--deepred);border-radius:4px;padding:1px 7px;display:inline-block}

.severe-banner{background:var(--red-wash);border:1px solid var(--red);color:var(--red-ink);font-size:12.5px;font-weight:700;
  padding:8px 10px;border-radius:6px;margin-bottom:10px}
.clear-note,.no-data-note{font-size:13px;color:var(--dim)}
.roof-note{font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:5px 9px;margin-bottom:10px}
.stale-note{font-size:12px;color:var(--orange-ink);background:var(--orange-wash);border-radius:6px;padding:5px 9px;margin-bottom:10px}
.clear-note{color:var(--green-ink);font-weight:600}

/* Impact widget (baseball): weather glyph + field diagram on the left,
   diverging HR/Runs/XBH bars on the right. */
.impact-box{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;margin-bottom:10px}
.impact-weather{flex-shrink:0;width:92px;display:flex;flex-direction:column;align-items:center;gap:2px}
.impact-icon{font-size:1.5rem;line-height:1}
.impact-temp-wind{font-size:11.5px;color:var(--dim);text-align:center;line-height:1.3;margin-top:2px}
.impact-bars{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.impact-bar-row{display:flex;align-items:center;gap:8px}
.impact-bar-label{width:36px;flex-shrink:0;font-size:12px;color:var(--dim)}
.impact-bar-track{position:relative;flex:1;height:7px;border-radius:4px;background:var(--hover);overflow:hidden}
.impact-bar-center{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--border2)}
.impact-bar-fill{position:absolute;top:0;bottom:0;border-radius:4px}
.impact-bar-fill.neg{right:50%;background:var(--red)}
.impact-bar-fill.pos{left:50%;background:var(--green)}
.impact-bar-pct{width:44px;flex-shrink:0;text-align:right;font-size:12.5px;font-weight:700;color:var(--dim)}
.impact-bar-pct.neg{color:var(--red-ink)}
.impact-bar-pct.pos{color:var(--green-ink)}
.impact-caveat{font-size:11px;color:var(--dim);margin-top:-4px;margin-bottom:10px}

/* Park factor — static historical park character, separate from the
   day's weather-driven delta above. */
.park-factor-line{font-size:11.5px;color:var(--dim);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.park-factor-line .pf-chip{color:var(--bright);font-weight:600}
.park-factor-line .pf-chip.hot{color:var(--orange-ink)}
.park-factor-line .pf-chip.cold{color:var(--cold)}

.field-svg{flex-shrink:0}

/* Football field-orientation strip. */
.field-orient{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--border);
  border-radius:8px;padding:8px 10px;margin-bottom:10px}
.field-orient-text{font-size:12.5px;color:var(--dim);line-height:1.45}
.field-orient-text b{color:var(--bright);font-weight:600}
.field-svg-mini{vertical-align:middle;margin-right:4px;flex-shrink:0}
.field-orient-text .fo-read{color:var(--text)}
.impact-read{font-size:12.5px;color:var(--text);line-height:1.4;margin:-4px 0 6px}
.nfl-model{font-size:12px;color:var(--dim);background:var(--panel);border:1px solid var(--border);border-radius:8px;
  padding:6px 10px;margin-bottom:10px;line-height:1.4}
.nfl-model b{color:var(--bright);font-weight:600}

.detail-toggle{font-size:12.5px;font-weight:600;color:var(--dim);cursor:pointer;text-decoration:underline;margin-top:4px;display:inline-block}
.detail-toggle:hover{color:var(--bright)}
.hourly-detail{display:none;margin-top:10px;border-top:1px dashed var(--border2);padding-top:8px}
.hourly-detail.open{display:block}
.hourly-row{font-size:12px;color:var(--dim);display:flex;align-items:center;justify-content:space-between;padding:3px 0;gap:6px;flex-wrap:wrap}
.hourly-row .hr-left{display:flex;align-items:center;color:var(--bright);font-weight:500}

/* ── Clock | Game-state toggle (2026-10-07) ──────────────────────────
   Segmented control in the control bar; the choice is remembered per
   browser under wx.view. Game view lists weather by inning / quarter
   (projected from average game pace, see game_phases.py). */
.controls .ctl{font-size:13px;color:var(--dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:7px;overflow:hidden;background:var(--card)}
.seg button{font-size:13px;font-weight:600;color:var(--dim);background:transparent;border:none;padding:6px 11px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--border2)}
.seg button:hover{color:var(--bright)}
.seg button.on{background:var(--bright);color:var(--card)}
.seg button:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--brass)}
/* "When it changes" callout — visible without opening the detail panel. */
.wx-changes{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 10px;margin-bottom:10px}
.wx-changes-h{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--dim);margin-bottom:3px}

.wx-change .at{flex-shrink:0;min-width:58px;font-weight:700;color:var(--bright)}
.wx-change.k-rain .at,.wx-change.k-delay .at{color:var(--cold)}
.wx-change.k-wind .at,.wx-change.k-flip .at{color:var(--orange-ink)}
/* Phase rows + the game-state tag on hourly rows. */
.ph-tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:999px;font-size:10.5px;font-weight:600;line-height:17px;
  background:var(--hover);color:var(--dim);white-space:nowrap}
.ph-label{display:inline-block;min-width:34px;font-weight:700;color:var(--bright)}
.ph-clock{color:var(--dim);font-weight:400}
/* Phase table: fixed columns sized for the ~350px card body, so nothing
   wraps; the projected clock time sits under the inning/quarter label. */
.ph-row{display:grid;grid-template-columns:minmax(92px,1.2fr) minmax(50px,.8fr) 38px minmax(78px,1.4fr) 42px;
  align-items:center;gap:5px;font-size:12px;color:var(--dim);padding:3px 0}

/* ── footer: one quiet line ───────────────────────────────────────── */
footer{flex-shrink:0;padding:6px 22px;border-top:1px solid var(--border);background:var(--surface);display:flex;

.stamp span+span:not(:empty)::before{content:" · "}

/* ── phone widths: same sizes as the WhizShap / Hawkey mobile headers ─ */
@media (max-width:600px){
  header{height:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;gap:8px}
  .brand{gap:7px}

}

<body>

<header>
  <a class="brand" href="./" title="Game-Day Weather">
    <svg class="wk-badge" viewBox="0 0 100 100" role="img" aria-label="Whizkid Automations"><polygon points="50,3 91,26.5 91,73.5 50,97 9,73.5 9,26.5" fill="#B8914A"/><polygon points="50,11 84,30.5 84,69.5 50,89 16,69.5 16,30.5" fill="none" stroke="#14233A" stroke-opacity=".5" stroke-width="1.8"/><text x="44" y="58" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="46" fill="#14233A">w</text><text x="63" y="76" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="42" fill="#F3ECDD" stroke="#14233A" stroke-width="2.4" paint-order="stroke">k</text></svg>
    <div style="min-width:0">
      <div class="logo">Game-Day <b>Weather</b></div>
      <div class="hd">Venue conditions · Whizkid Automations</div>
    </div>
  </a>
  <div class="spacer"></div>
  <button class="hbtn" id="refreshBtn" onclick="refreshData()" title="Re-read the latest forecast file"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span class="lbl">Refresh</span></button>
  <button class="hbtn" id="theme-btn" title="Switch light / dark"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
</header>

<nav id="tabs">
  <button class="tab" data-page="NFL" onclick="selectPage('NFL')">NFL<span class="tab-count" id="count-NFL">0</span></button>
  <button class="tab" data-page="CFB_FBS" onclick="selectPage('CFB_FBS')">CFB · FBS<span class="tab-count" id="count-CFB_FBS">0</span></button>

  <button class="tab" data-page="CBB" onclick="selectPage('CBB')">College Baseball<span class="tab-count" id="count-CBB">0</span></button>
</nav>

<div class="controls">
  <input type="text" id="searchBox" placeholder="Search team or venue…" oninput="render()">
  <label><input type="checkbox" id="hideClear" onchange="render()"> Hide clear</label>
  <label><input type="checkbox" id="hideIndoor" onchange="render()"> Hide indoor</label>
  <label>Times <select id="tzSelect" onchange="setTimezone(this.value)"></select></label>
  <label>Sort <select id="sortSelect" onchange="setSort(this.value)">
    <option value="time">Game time</option>
    <option value="severity">Worst conditions</option>
  </select></label>
  <span class="ctl">View <span class="seg" id="viewSeg" role="group" aria-label="Show weather by clock time or game state">
    <button type="button" data-view="clock" onclick="setView('clock')" title="Weather by clock hour">Clock</button>
    <button type="button" data-view="game" onclick="setView('game')" title="Weather by inning / quarter (projected from average game pace)">Game state</button>

    <span><span class="legend-dot" style="background:var(--green)"></span>Clear</span>
    <span><span class="legend-dot" style="background:var(--yellow)"></span>Advisory</span>
    <span><span class="legend-dot" style="background:var(--orange)"></span>Watch</span>
    <span><span class="legend-dot" style="background:var(--red)"></span>Significant</span>
    <span><span class="legend-dot" style="background:var(--deepred)"></span>Heavy</span>
    <span>🚨 Severe alert</span>
  </div>
</div>

<div class="status-banner" id="statusBanner"></div>
<main><div class="grid" id="grid"></div></main>

<footer>
  <div><b>Game-Day Weather</b> · Whizkid Automations</div>
  <div class="stamp"><span id="generatedAt">Loading…</span><span id="lastUpdated"></span></div>
</footer>

<script>
// No data is embedded in this file — it's a permanent static page that
// pulls whatever weather_data.py last wrote via the Flask API below, both
// on load and whenever the Refresh button is clicked. Nothing here needs
// to be regenerated when the data changes; only weather_data.json does.
const API_URL = location.pathname.replace(/\/[^\/]*$/, "") + "/api/weather";  // "" on :5050, "/weather" behind nginx
let DATA = { generated_at: "", generated_at_iso: "", buckets: { NFL: [], CFB_FBS: [], CFB_FCS: [], MLB: [], CBB: [] } };
const PAGE_META = [["NFL", "🏈", "NFL"], ["CFB_FBS", "🎓", "CFB · FBS"], ["CFB_FCS", "🎓", "CFB · FCS"], ["MLB", "⚾", "MLB"], ["CBB", "⚾", "College Baseball"]];
let currentPage = "NFL";

// ── Time zone ────────────────────────────────────────────────────────────────
// Every time on the page (kickoffs, hourly rows, peak-wind time, the
// footer time stamps) is converted client-side from the UTC timestamps in
// weather_data.json into ONE zone, Eastern by default. "Venue local" keeps
// each game in its own stadium's zone (the old behavior); "This device" uses
// whatever zone the browser reports. The choice is remembered per browser.
const TZ_OPTIONS = [
  ["America/New_York", "Eastern (ET)"],
  ["America/Chicago", "Central (CT)"],
  ["America/Denver", "Mountain (MT)"],
  ["America/Phoenix", "Arizona (MST)"],
  ["America/Los_Angeles", "Pacific (PT)"],
  ["America/Anchorage", "Alaska (AKT)"],
  ["Pacific/Honolulu", "Hawaii (HT)"],
  ["device", "This device"],
  ["venue", "Venue local"],
];
const DEFAULT_TZ = "America/New_York";
const DEVICE_TZ = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || DEFAULT_TZ; } catch (e) { return DEFAULT_TZ; } })();
function loadPref(key, fallback) { try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; } }
function savePref(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* private window etc. */ } }
let tzChoice = loadPref("wx.tz", DEFAULT_TZ);
if (!TZ_OPTIONS.some(([v]) => v === tzChoice)) tzChoice = DEFAULT_TZ;
let sortChoice = loadPref("wx.sort", "time");
if (sortChoice !== "time" && sortChoice !== "severity") sortChoice = "time";
// Clock | Game state. "game" shows weather by inning / quarter wherever
// weather_data.py attached phases (outdoor games with a forecast); cards
// without them (indoor, no data) just keep the hourly view.
let viewChoice = loadPref("wx.view", "clock");
if (viewChoice !== "clock" && viewChoice !== "game") viewChoice = "clock";

// The zone to show a given game in (null g = page-level, e.g. day headers).
function zoneFor(g) {
  if (tzChoice === "device") return DEVICE_TZ;
  if (tzChoice === "venue") return (g && g.tz) || DEFAULT_TZ;
  return tzChoice;
}
function parseUtc(iso) {
  if (!iso) return null;
  const d = new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(iso) ? iso : iso + "Z");
  return isNaN(d) ? null : d;
}
const _fmtCache = {};
function fmtParts(date, zone, opts) {
  const key = zone + JSON.stringify(opts);
  let f = _fmtCache[key];
  if (!f) {
    try { f = new Intl.DateTimeFormat("en-US", { timeZone: zone, ...opts }); }
    catch (e) { f = new Intl.DateTimeFormat("en-US", { timeZone: DEFAULT_TZ, ...opts }); }
    _fmtCache[key] = f;
  }
  return f.format(date);
}
// "8:15 PM EDT"
function fmtClock(iso, zone) {
  const d = parseUtc(iso);
  return d ? fmtParts(d, zone, { hour: "numeric", minute: "2-digit", timeZoneName: "short" }) : null;
}
// "Thu 9/17 · 8:15 PM EDT"
function fmtKickoff(g) {
  const d = parseUtc(g.game_time_utc);
  if (!d) return g.start_local || "TBD";
  const zone = zoneFor(g);
  return fmtParts(d, zone, { weekday: "short", month: "numeric", day: "numeric" }).replace(",", "") + " · " + fmtClock(g.game_time_utc, zone);
}
function dayKey(g) {
  const d = parseUtc(g.game_time_utc);
  return d ? fmtParts(d, zoneFor(g), { year: "numeric", month: "2-digit", day: "2-digit" }) : "TBD";
}
function dayLabel(g) {
  const d = parseUtc(g.game_time_utc);
  return d ? fmtParts(d, zoneFor(g), { weekday: "long", month: "short", day: "numeric" }) : "Time TBD";
}
function initTimezoneSelect() {
  const sel = document.getElementById("tzSelect");
  sel.innerHTML = TZ_OPTIONS.map(([v, label]) =>
    `<option value="${v}">${esc(v === "device" ? `${label} (${DEVICE_TZ})` : label)}</option>`).join("");
  sel.value = tzChoice;
  document.getElementById("sortSelect").value = sortChoice;
  syncViewButtons();
}
function syncViewButtons() {
  document.querySelectorAll("#viewSeg button").forEach(b => {
    const on = b.dataset.view === viewChoice;
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
}
function setView(v) { viewChoice = v; savePref("wx.view", v); syncViewButtons(); render(); }
function setTimezone(v) { tzChoice = v; savePref("wx.tz", v); renderGeneratedAt(); renderLastUpdated(); render(); }
function setSort(v) { sortChoice = v; savePref("wx.sort", v); render(); }
function renderGeneratedAt() {
  const el = document.getElementById("generatedAt");
  const d = parseUtc(DATA.generated_at_iso);
  if (!d) { el.textContent = "Forecasts pulled " + (DATA.generated_at || "unknown"); return; }
  const zone = tzChoice === "venue" ? DEFAULT_TZ : zoneFor(null);
  el.textContent = "Forecasts pulled " + fmtParts(d, zone, { weekday: "short", month: "short", day: "numeric" }) + ", " + fmtClock(DATA.generated_at_iso, zone);
}

// Footer stamps:
//   "Forecasts pulled" = DATA.generated_at_iso, when weather_data.py (cron)
//                        last fetched forecasts and wrote weather_data.json.
//   "Page refreshed"   = when this browser last read that file via /api/weather
//                        (page load or the Refresh button — which re-reads the
//                        file, it does NOT pull new forecasts).
// An old "Forecasts pulled" with a fresh "Page refreshed" means the cron job
// is behind; the reverse means the page just hasn't been reloaded.
let clientLastUpdated = null;
function renderLastUpdated() {
  const el = document.getElementById("lastUpdated");
  if (!clientLastUpdated) { el.textContent = ""; return; }
  const zone = tzChoice === "venue" ? DEFAULT_TZ : zoneFor(null);
  el.textContent = "Page refreshed " + fmtParts(clientLastUpdated, zone, { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
}

function esc(s) { return (s ?? "").toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function fmtNum(v, digits) { return (v === null || v === undefined) ? "—" : Number(v).toFixed(digits ?? 0); }

function fmtSigned(v, digits) {
  if (v === null || v === undefined) return "—";
  const n = Number(v);
  return (n > 0 ? "+" : "") + n.toFixed(digits ?? 0);
}

function severityClass(rank) { return "sev-" + Math.min(rank, 5); }

// ── Live games (2026-10-08) ─────────────────────────────────────────────────
// weather_data.py (cron --auto, every 10 min while anything is live) already
// drops finished games and the hours/quarters/innings that have been played.
// Between refreshes the page keeps doing the same thing on its own clock:
// played hours, completed phases and past "when it changes" rows fall off
// every minute, and a card leaves once its game is final — or, as a backstop
// if the data has gone stale, 90 min past its projected final.
const DEFAULT_GAME_HOURS = { NFL: 3.5, CFB: 3.5, MLB: 4.0, CBB: 3.0 };
const OVER_GRACE_MIN = 90;
const HOUR_MS = 3600e3;
function startMs(g) { const d = parseUtc(g.game_time_utc); return d ? d.getTime() : null; }
function isLive(g) { return g.state === "in"; }
function underway(g, now) { const s = startMs(g); return isLive(g) || (s !== null && s <= now && g.state !== "pre"); }
function projectedEndMs(g) {
  const e = parseUtc((g.pace || {}).end_utc);
  if (e) return e.getTime();
  const ws = parseUtc(g.window_start_utc), s = startMs(g);
  const base = ws ? ws.getTime() : s;
  if (base === null) return null;
  return base + (g.window_hours || DEFAULT_GAME_HOURS[g.sport] || 3.5) * HOUR_MS;
}
function isOver(g, now) {
  if (g.state === "post") return true;
  const end = projectedEndMs(g);
  return end !== null && now > end + OVER_GRACE_MIN * 60e3;
}
// A copy of the game with what's already been played removed.
function liveView(g, now) {
  if (!underway(g, now)) return g;
  const v = { ...g };
  if (g.hours) v.hours = g.hours.filter(h => { const t = parseUtc(h.time_utc); return !t || t.getTime() + HOUR_MS > now; });
  if (g.phases) v.phases = g.phases.filter(p => { const e = parseUtc(p.end_utc); return !e || e.getTime() > now; });
  if (g.phase_changes) v.phase_changes = g.phase_changes.filter(c => { const t = parseUtc(c.at_utc); return !t || t.getTime() >= now; });
  return v;
}
function visibleGames(key, now) {
  return (DATA.buckets[key] || []).filter(g => !isOver(g, now)).map(g => liveView(g, now));
}
function liveChip(g) {
  if (!isLive(g)) return "";
  const pace = g.pace || {};
  const txt = pace.live_break ? "Halftime" : (g.status_detail || "");
  return `<span class="live-chip" title="In progress — showing the rest of the game">LIVE${txt ? " · " + esc(txt) : ""}</span>`;
}

const TIER_RANK_JS = {
  wind_advisory:1, cold_advisory:1, heat_advisory:1, snow_advisory:1,
  wind_gust_watch:2, rain_moderate:2,
  wind_significant:3, cold_warning:3, heat_warning:3, snow_warning:3,
  rain_heavy:4,
};

// Small ballpark diagram with an arrow for wind relative to the CF
// orientation. bw = {in_out_mph, lr_mph, ...} from wind_effect() server-side
// (in_out positive = blowing OUT to CF, lr positive = toward RF). Same shape
// used for the impact-box weather icon (size ~74-90, unlabeled) and the
// compact icon next to each hourly row (size ~26, unlabeled) — just a size
// toggle; showLabels is kept for callers that still want CF/LF/RF text.
function fieldSVG(bw, size, showLabels) {
  const W = size, H = Math.round(size * 1.05);
  if (!bw) {
    return `<svg class="field-svg" width="${W}" height="${H}" viewBox="0 0 100 105"></svg>`;
  }
  const mag = Math.hypot(bw.in_out_mph || 0, bw.lr_mph || 0);
  const color = mag >= 20 ? "var(--red)" : mag >= 15 ? "var(--orange)" : mag >= 8 ? "var(--yellow)" : "var(--green)";
  let arrow;
  if (mag < 1) {
    arrow = `<circle cx="50" cy="72" r="3" fill="${color}"/>`;
  } else {
    const ux = bw.lr_mph / mag, uy = -bw.in_out_mph / mag;
    const len = Math.min(45, 14 + mag * 1.3);
    const ex = 50 + ux * len, ey = 72 + uy * len;
    const ang = Math.atan2(ey - 72, ex - 50);
    const ah = 5;
    const p1x = ex - ah * 1.6 * Math.cos(ang - 0.4), p1y = ey - ah * 1.6 * Math.sin(ang - 0.4);
    const p2x = ex - ah * 1.6 * Math.cos(ang + 0.4), p2y = ey - ah * 1.6 * Math.sin(ang + 0.4);
    arrow = `<line x1="50" y1="72" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}" stroke="${color}" stroke-width="3" stroke-linecap="round"/>` +
            `<polygon points="${ex.toFixed(1)},${ey.toFixed(1)} ${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}" fill="${color}"/>`;
  }
  const labels = showLabels ? `
    <text x="50" y="11" text-anchor="middle" font-size="7" fill="var(--muted)" font-family="var(--font-mono)">CF</text>
    <text x="12" y="50" text-anchor="middle" font-size="7" fill="var(--muted)" font-family="var(--font-mono)">LF</text>
    <text x="88" y="50" text-anchor="middle" font-size="7" fill="var(--muted)" font-family="var(--font-mono)">RF</text>
  ` : "";
  return `<svg class="field-svg" width="${W}" height="${H}" viewBox="0 0 100 105">
    <path d="M 15 52 Q 50 15 85 52" fill="none" stroke="var(--field-line)" stroke-width="2"/>
    <line x1="50" y1="90" x2="15" y2="52" stroke="var(--field-line)" stroke-width="1.5"/>
    <line x1="50" y1="90" x2="85" y2="52" stroke="var(--field-line)" stroke-width="1.5"/>
    <polygon points="50,90 38,72 50,58 62,72" fill="none" stroke="var(--field-line)" stroke-width="1.2"/>
    <circle cx="50" cy="90" r="2.2" fill="var(--muted)"/>
    ${labels}
    ${arrow}
  </svg>`;
}

// Rough condition icon for the impact-box weather glyph — severe alert and
// snow/rain take priority over a plain temperature read, since those are
// the conditions that actually change how the game plays.
function weatherEmoji(g) {
  const s = g.snapshot || {};
  if (g.severe && g.severe.length) return "⛈️";
  if ((s.snow_inhr || 0) > 0) return "🌨️";
  if ((s.rain_pct || 0) >= 50) return "🌧️";
  if ((s.rain_pct || 0) >= 25) return "🌦️";
  if ((s.temp_f ?? 70) >= 90) return "🔥";
  if ((s.temp_f ?? 70) <= 35) return "🥶";
  return "☀️";
}

// Diverging bar centered at 0%, capped at +/-IMPACT_CAP_PCT so one extreme
// outlier game doesn't flatten every other bar on the page. Red = below-
// neutral (suppressing), green = above-neutral (boosting) — matches the
// dashboard's existing red/green severity language elsewhere on the card.
const IMPACT_CAP_PCT = 25;

function impactBarRow(label, pct) {
  const v = (pct === null || pct === undefined) ? 0 : Number(pct);
  const capped = Math.max(-IMPACT_CAP_PCT, Math.min(IMPACT_CAP_PCT, v));
  const halfWidthPct = (Math.abs(capped) / IMPACT_CAP_PCT) * 50;
  const cls = v > 0.5 ? "pos" : (v < -0.5 ? "neg" : "");
  const fill = cls ? `<div class="impact-bar-fill ${cls}" style="width:${halfWidthPct.toFixed(1)}%"></div>` : "";
  return `<div class="impact-bar-row">
    <span class="impact-bar-label">${esc(label)}</span>
    <div class="impact-bar-track"><div class="impact-bar-center"></div>${fill}</div>
    <span class="impact-bar-pct ${cls}">${fmtSigned(v, 0)}%</span>
  </div>`;
}

// The weather-icon + field-diagram + temp/wind readout on the left, paired
// with diverging HR/Runs/XBH bars on the right. g.impact comes from
// weather_common.py's baseball_carry_impact() (temp + wind + humidity +
// park elevation vs. neutral, translated to a rough HR% shift, with Runs%/
// XBH% scaled off that — see CARRY_* comments in weather_common.py for the
// full sourcing and error-bar caveats).
function renderImpactBox(g) {
  const imp = g.impact;
  if (!imp) return "";
  const s = g.snapshot || {};
  const windLine = (s.wind_mph !== undefined && s.wind_mph !== null)
    ? `${fmtNum(s.wind_mph,0)} mph ${esc(s.wind_compass || "")}` : "";
  // A wind out / in / crosswind tier carries this park's wind read at its peak
  // hour — show the mid-game sentence only when no such tier fired.
  const dirTier = (g.tiers || []).some(t => /^(wind_out|wind_in|crosswind)_/.test(t.key || ""));
  const fieldTitle = g.baseball_wind ? `${esc(g.baseball_wind.in_out_label)} · ${esc(g.baseball_wind.lr_label)}` : "";
  return `<div class="impact-box">
    <div class="impact-weather">
      <div class="impact-icon">${weatherEmoji(g)}</div>
      <span title="${fieldTitle}">${fieldSVG(g.baseball_wind, 74, false)}</span>
      <div class="impact-temp-wind">${fmtNum(s.temp_f,0)}°F<br>${windLine}</div>
    </div>
    <div class="impact-bars">
      ${impactBarRow("HR", imp.hr_pct)}
      ${impactBarRow("Runs", imp.runs_pct)}
      ${impactBarRow("XBH", imp.xbh_pct)}
    </div>
  </div>
  ${imp.text && !dirTier ? `<div class="impact-read">${esc(imp.text)}</div>` : ""}
  <div class="impact-caveat">Est. vs. neutral (70°F/50% RH/no wind), mid-game${(imp.hr_min !== null && imp.hr_min !== undefined && Math.round(imp.hr_min) !== Math.round(imp.hr_max)) ? ` · HR ${fmtSigned(imp.hr_min,0)}% to ${fmtSigned(imp.hr_max,0)}% across the game` : ""} — order-of-magnitude, not a precise forecast${g.cf_verified === false ? " · ⚠️ park orientation unverified, in/out wind approximate" : ""}</div>`;
}

function renderSnapshot(g) {
  const s = g.snapshot || {};
  if (g.no_data) return "";
  const chips = [];
  if (s.temp_f !== undefined && s.temp_f !== null) {
    let t = `🌡️ <b>Temp</b> ${fmtNum(s.temp_f,0)}°F`;
    if (s.feels_f !== null && s.feels_f !== undefined) t += ` (feels ${fmtNum(s.feels_f,0)}°F)`;
    chips.push(`<span class="chip">${t}</span>`);
  }
  if (s.wind_mph !== undefined && s.wind_mph !== null) {
    chips.push(`<span class="chip">💨 <b>Wind</b> ${fmtNum(s.wind_mph,0)} mph, gusts ${fmtNum(s.gust_mph,0)} ${esc(s.wind_compass || "")}</span>`);
  }
  if (s.rain_pct !== undefined && s.rain_pct !== null) {
    chips.push(`<span class="chip">🌧️ <b>Rain</b> ${fmtNum(s.rain_pct,0)}% / ${fmtNum(s.rain_inhr,2)}in/hr</span>`);
  }
  if (s.snow_inhr) {
    chips.push(`<span class="chip">🌨️ <b>Snow</b> ${fmtNum(s.snow_inhr,2)} in/hr</span>`);
  }
  if (s.humidity !== undefined && s.humidity !== null) {
    chips.push(`<span class="chip">💧 <b>Humidity</b> ${fmtNum(s.humidity,0)}%</span>`);
  }
  return `<div class="snapshot">${chips.join("")}</div>`;
}

// Detail panels stay open across re-renders (flipping Clock/Game, changing
// the time zone or sort) so you can compare the two views of one game.
const openDetails = new Set();
function gameKey(g) { return [g.sport, g.away, g.home, g.game_time_utc].join("|"); }
function toggleDetail(el) {
  const key = el.dataset.key, panel = el.nextElementSibling;
  const open = !openDetails.has(key);
  if (open) openDetails.add(key); else openDetails.delete(key);
  panel.classList.toggle("open", open);
  el.setAttribute("aria-expanded", open ? "true" : "false");
}
function detailBlock(g, label, rowsHtml) {
  const key = gameKey(g), open = openDetails.has(key);
  return `<span class="detail-toggle" role="button" tabindex="0" aria-expanded="${open}" data-key="${esc(key)}" ` +
         `onclick="toggleDetail(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleDetail(this)}">${esc(label)} ▾</span>` +
         `<div class="hourly-detail${open ? " open" : ""}">${rowsHtml}</div>`;
}

function showGameView(g) { return viewChoice === "game" && g.phases && g.phases.length > 0; }
function fmtDur(min) { const m = Math.round(min || 0); return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m`; }
function fieldRelWord(angle) { return angle >= 60 ? "cross" : angle <= 30 ? "along" : "quarter"; }
// "cross 14" / "along 12" / "qtr 9/8" — the component that matters, in mph.
function fieldRelCell(x) {
  const w = fieldRelWord(x.field_angle);
  if (x.along_mph === undefined || x.along_mph === null || (x.wind_mph || 0) < 1) return w;
  const al = Math.abs(x.along_mph), cr = Math.abs(x.cross_mph);
  return w === "cross" ? `cross ${fmtNum(cr,0)}` : w === "along" ? `along ${fmtNum(al,0)}` : `qtr ${fmtNum(al,0)}/${fmtNum(cr,0)}`;
}
function fieldRelTitle(x) {
  if (x.along_mph === undefined || x.along_mph === null) return "";
  let t = `${fmtNum(Math.abs(x.along_mph),0)} mph along the field, ${fmtNum(Math.abs(x.cross_mph),0)} across`;
  if (x.headwind_end) t += ` — kicks toward the ${x.headwind_end} end zone are into the wind`;
  return t;
}

// "When it changes" — the point of the toggle: where in the game the weather
// moves. Anchored to the inning/quarter in Game view, to the clock in Clock view.
function renderChanges(g) {
  const ch = g.phase_changes || [];
  if (!ch.length) return "";
  const game = viewChoice === "game";
  const rows = ch.map(c => {
    const at = game ? c.at_label : ("~" + ((c.at_utc && fmtClock(c.at_utc, zoneFor(g))) || c.at_label).replace(/\s\S+$/, ""));
    return `<div class="wx-change k-${esc(c.kind)}"><span class="at">${esc(at)}</span><span>${esc(c.text)}</span></div>`;
  }).join("");
  return `<div class="wx-changes"><div class="wx-changes-h">⏱ When it changes</div>${rows}</div>`;
}

function renderPhases(g) {
  const isBaseball = g.sport === "MLB" || g.sport === "CBB";
  const zone = zoneFor(g);
  const rows = g.phases.map(p => {
    const clock = p.start_utc ? fmtClock(p.start_utc, zone).replace(/\s\S+$/, "") : "";
    const feel = (p.feels_f !== null && p.feels_f !== undefined && Math.round(p.feels_f) !== Math.round(p.temp_f))
      ? `<br><span class="ph-feel">feels ${fmtNum(p.feels_f,0)}°</span>` : "";
    const hasVec = isBaseball && p.in_out_mph !== null && p.in_out_mph !== undefined;
    const icon = isBaseball
      ? `<span class="field-svg-mini" title="${esc(p.in_out_label || "wind direction vs. CF unknown")}${p.lr_label ? " · " + esc(p.lr_label) : ""}">${fieldSVG(hasVec ? p : null, 26, false)}</span>`
      : "";
    const label = p.kind === "break" ? "Halftime" : p.kind === "delay" ? "Rain delay" : p.label;
    const rel = (!isBaseball && p.field_angle !== undefined && p.field_angle !== null) ? `<span class="ph-rel" title="${esc(fieldRelTitle(p))}"> · ${fieldRelCell(p)}</span>` : "";
    const hr = (isBaseball && p.hr_pct !== null && p.hr_pct !== undefined)
      ? `<span class="ph-hr ${p.hr_pct > 0.5 ? "pos" : p.hr_pct < -0.5 ? "neg" : ""}" title="Est. HR-rate shift vs. neutral">${fmtSigned(p.hr_pct,0)}%</span>` : "";
    const cls = (p.kind === "break" ? " ph-break" : p.kind === "delay" ? " ph-delay" : "") + (p.beyond_forecast ? " ph-beyond" : "");
    const tip = p.beyond_forecast ? ` title="Past the end of the forecast window — showing the last forecast hour"` : "";
    return `<div class="ph-row${cls}"${tip}><span class="hr-left${icon ? " has-icon" : ""}">${icon}<span class="ph-label">${esc(label)}</span><span class="ph-clock">~${esc(clock)}</span></span>` +
           `<span>${fmtNum(p.temp_f,0)}°F${feel}</span><span>${fmtNum(p.rain_pct,0)}%</span>` +
           `<span>${fmtNum(p.wind_mph,0)}/${fmtNum(p.gust_mph,0)} ${esc(p.compass || "")}${rel}</span><span>${hr}</span></div>`;
  }).join("");
  const pace = g.pace || {};
  const avg = `~${fmtDur(pace.total_min)} ${pace.source === "calibration" ? "fitted" : "average"} game`;
  const unitWord = pace.unit === "inning" ? "inning" : "quarter";
  const note = pace.anchor === "live"
    ? ((pace.live_break || g.phases[0].kind === "break") ? `Re-anchored to halftime; the second half at the ${avg} pace.`
       : `Re-anchored to the live game (${esc(g.phases[0].label)}); later ${unitWord}s at the ${avg} pace.`)
    : `Projected from a ${avg} at the listed start time.`;
  const delayNote = pace.delay_min
    ? ` Includes ~${fmtDur(pace.delay_min).replace(/^0h /, "")} of projected rain delay${pace.postpone_risk ? " — rain may outlast a 3-hour delay (postponement risk)" : ""}.` : "";
  const unit = pace.unit === "inning" ? "inning" : "quarter";
  const head = `<div class="ph-row ph-head"><span>${unit === "inning" ? "Inning" : "Quarter"}</span><span>Temp</span><span>Rain</span><span>Wind/gust</span><span>${isBaseball ? "HR" : ""}</span></div>`;
  return detailBlock(g, `By ${unit}`, head + rows +
    `<div class="pace-note">${note}${delayNote} Real pace varies — ${g.sport === "MLB" ? "extra innings and blowouts aren't modelled (rain delays are projected from the forecast)" : `delays, ${unit === "inning" ? "extra innings" : "overtime"} and blowouts aren't modelled`}. Times are approximate.</div>`);
}

function renderHourly(g) {
  if (!g.hours || !g.hours.length) return "";
  if (showGameView(g)) return renderPhases(g);
  const isBaseball = g.sport === "MLB" || g.sport === "CBB";
  const rows = g.hours.map(h => {
    let feel = "";
    if (h.wind_chill_f !== null && h.wind_chill_f !== undefined) feel = ` feels ${fmtNum(h.wind_chill_f,0)}°F`;
    else if (h.heat_index_f !== null && h.heat_index_f !== undefined) feel = ` feels ${fmtNum(h.heat_index_f,0)}°F`;
    const hasWindVec = isBaseball && h.in_out_mph !== undefined && h.in_out_mph !== null;
    const icon = hasWindVec
      ? `<span class="field-svg-mini" title="${esc(h.in_out_label)} · ${esc(h.lr_label)}">${fieldSVG(h, 26, false)}</span>`
      : "";
    const fieldRel = (!isBaseball && h.field_angle !== undefined && h.field_angle !== null)
      ? ` · ${fieldRelCell(h)}` : "";
    // Zone abbreviation moves to the panel label so the game-state tag fits on one line.
    const hourLabel = (h.time_utc && fmtClock(h.time_utc, zoneFor(g)).replace(/\s\S+$/, "")) || h.local_time;
    const tag = h.phase_span ? `<span class="ph-tag" title="Projected game state during this hour">${esc(h.phase_span)}</span>` : "";
    return `<div class="hourly-row"><span class="hr-left">${icon}${esc(hourLabel)}${tag}</span><span>${fmtNum(h.temp_f,0)}°F${feel}</span>` +
           `<span>Rain ${fmtNum(h.rain_pct,0)}%</span><span>Wind ${fmtNum(h.wind_mph,0)}/${fmtNum(h.gust_mph,0)} ${esc(h.compass)}${fieldRel}</span></div>`;
  }).join("");
  const z = g.hours[0].time_utc && fmtClock(g.hours[0].time_utc, zoneFor(g));
  const abbr = z ? z.split(" ").pop() : "";
  return detailBlock(g, `${isLive(g) ? "Rest of game" : "Hourly detail"}${abbr ? " · " + abbr : ""}`, rows);
}

function renderParkFactorLine(g) {
  const pf = g.park_factor;
  if (!pf) return "";
  const chip = (label, val) => {
    if (val === null || val === undefined) return "";
    const cls = val >= 105 ? "hot" : (val <= 95 ? "cold" : "");
    return `<span class="pf-chip ${cls}">${esc(label)} ${val}</span>`;
  };
  // pf.runs is Savant's runs index; pf.basic_5yr is the older FanGraphs key,
  // still read so a stale weather_data.json renders during the switchover.
  const runs = pf.runs ?? pf.basic_5yr;
  const span = pf.years ? `${esc(pf.years)}` : "multi-year";
  return `<div class="park-factor-line" title="Baseball Savant Statcast park factors">` +
    `<span class="pf-label">Park factor (${span}, 100=avg):</span>` +
    chip("HR", pf.hr) + chip("Runs", runs) + chip("2B", pf["2b"]) + chip("3B", pf["3b"]) +
  `</div>`;
}

// Mini football field, long axis drawn vertically, with the wind arrow
// rotated into the field's frame: fo.azimuth is the field's long-axis
// bearing, fo.wind_from the meteorological FROM direction, so the wind
// blows TOWARD wind_from+180. Which end zone is "up" is arbitrary (the
// azimuth is an axis, not a direction) — the arrow only shows along vs.
// across, which is what matters for kicking and the deep passing game.
// fo.ends = [azimuth end, opposite end] as compass words; the top of the
// drawing is the azimuth end, so the labels say which end the arrow points at.
const END_ABBR = {north:"N", northeast:"NE", east:"E", southeast:"SE", south:"S", southwest:"SW", west:"W", northwest:"NW"};
function endLabels(fo) {
  if (!fo.ends || fo.ends.length !== 2) return "";
  const t = END_ABBR[fo.ends[0]] || "", b = END_ABBR[fo.ends[1]] || "";
  return `<text x="31" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="var(--bright)" font-family="var(--sans)">${t}</text>` +
         `<text x="31" y="93" text-anchor="middle" font-size="10" font-weight="700" fill="var(--bright)" font-family="var(--sans)">${b}</text>`;
}
function footballFieldSVG(fo, size) {
  const W = Math.round(size * 0.62), H = size;
  const rel = (((fo.wind_from + 180) - fo.azimuth) % 360 + 360) % 360 * Math.PI / 180;
  const mph = fo.wind_mph || 0;
  const color = mph >= 20 ? "var(--red)" : mph >= 15 ? "var(--orange)" : mph >= 8 ? "var(--yellow)" : "var(--green)";
  const cx = 31, cy = 50, len = Math.min(34, 12 + mph * 1.1);
  const dx = Math.sin(rel), dy = -Math.cos(rel);
  const x1 = cx - dx * len, y1 = cy - dy * len, x2 = cx + dx * len, y2 = cy + dy * len;
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const p1x = x2 - 8 * Math.cos(ang - 0.45), p1y = y2 - 8 * Math.sin(ang - 0.45);
  const p2x = x2 - 8 * Math.cos(ang + 0.45), p2y = y2 - 8 * Math.sin(ang + 0.45);
  let yard = "";
  for (let y = 22; y <= 78; y += 8) yard += `<line x1="6" y1="${y}" x2="56" y2="${y}" stroke="var(--field-line)" stroke-width="0.8"/>`;
  const arrow = mph < 1 ? `<circle cx="${cx}" cy="${cy}" r="3" fill="${color}"/>` :
    `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="3.2" stroke-linecap="round"/>` +
    `<polygon points="${x2.toFixed(1)},${y2.toFixed(1)} ${p1x.toFixed(1)},${p1y.toFixed(1)} ${p2x.toFixed(1)},${p2y.toFixed(1)}" fill="${color}"/>`;
  return `<svg class="field-svg" width="${W}" height="${H}" viewBox="0 0 62 100">
    <rect x="6" y="6" width="50" height="88" rx="2" fill="rgba(0,230,118,0.05)" stroke="var(--muted)" stroke-opacity="0.7" stroke-width="1.6"/>
    <rect x="6" y="6" width="50" height="10" fill="rgba(255,255,255,0.05)"/>
    <rect x="6" y="84" width="50" height="10" fill="rgba(255,255,255,0.05)"/>
    ${yard}${endLabels(fo)}${arrow}
  </svg>`;
}

// Field-relative wind (field_wind.py, 2026-10-07 audit): how much of the
// wind runs down the field (head/tailwind — changes kicking DISTANCE, and
// which end zone is into it) vs. across it (crosswind — changes ACCURACY,
// from which sideline). Older JSON without the components falls back to the
// angle-only read.
function fieldCompWord(fo) {
  if (fo.dominant === "light") return "Light";
  const a = fo.angle_off_axis;
  return a <= 30 ? "End-to-end" : a >= 60 ? "Crosswind" : "Quartering";
}
function renderFieldOrientation(g) {
  const fo = g.field_orientation;
  if (!fo) return "";
  const peakAt = (fo.at_utc && fmtClock(fo.at_utc, zoneFor(g))) || fo.at;
  const phase = fo.phase_span && !/game/i.test(fo.phase_span) ? ` (${esc(fo.phase_span)})` : "";
  const hasComp = fo.along_mph !== undefined && fo.along_mph !== null;
  const comp = hasComp
    ? `<br>Along the field <b>${fmtNum(Math.abs(fo.along_mph),0)}</b> mph · across <b>${fmtNum(Math.abs(fo.cross_mph),0)}</b> mph` +
      (fo.gust_along_mph !== null && fo.gust_along_mph !== undefined && (fo.gust_mph || 0) >= 20
        ? ` <span style="opacity:.75">(gusts ${fmtNum(Math.abs(fo.gust_along_mph),0)} / ${fmtNum(Math.abs(fo.gust_cross_mph),0)})</span>` : "")
    : "";
  // A wind tier already carries this sentence ("On this field: …") — don't say it twice.
  const tierSaysIt = (g.tiers || []).some(t => (t.key || "").startsWith("wind_") && (t.impact || "").includes("On this field"));
  const read = fo.short ? (tierSaysIt ? "" : `<br><span class="fo-read">${esc(fo.short)}</span>`)
    : `<br><span style="opacity:.75">${fo.angle_off_axis >= 60 ? "Crosswind: accuracy, not distance" : fo.angle_off_axis <= 30 ? "Head/tailwind: FG range swings by end zone" : "Mixed head and crosswind"}</span>`;
  const rev = fo.reversal ? `<br><span class="fo-read">↻ Wind turns around${fo.reversal.phase_span ? " in " + esc(fo.reversal.phase_span) : ""} — into-the-wind end moves to the ${esc(fo.reversal.to_end)} end zone</span>` : "";
  const why = (fo.detail || []).join(" ");
  return `<div class="field-orient" title="${esc(why)}${why ? "\n\n" : ""}Field axis ${fmtNum(fo.azimuth,1)}° (${esc(fo.confidence)}). Open-air 10 m forecast — field-level wind inside an enclosed bowl is usually lower and swirlier.">
    ${footballFieldSVG(fo, 66)}
    <div class="field-orient-text">
      🧭 <b>${fieldCompWord(fo)}</b> — ${fmtNum(fo.angle_off_axis,0)}° off the long axis<br>
      Peak ${fmtNum(fo.wind_mph,0)} mph (gusts ${fmtNum(fo.gust_mph,0)}) at ${esc(peakAt)}${phase}${comp}${read}${rev}
    </div>
  </div>`;
}

// NFL only: the fitted nflverse read the alerts carry (fit on total wind, so
// direction-agnostic — the field strip above is the direction read).
function renderNflModel(g) {
  const m = g.nfl_model;
  if (!m) return "";
  const parts = [];
  if (m.totals_lean_pts !== null && m.totals_lean_pts !== undefined)
    parts.push(`totals ${fmtSigned(m.totals_lean_pts,1)} pts vs. close in the ${esc(m.wind_bin)} mph bin (n=${esc(m.n)})`);
  if (m.fg && m.fg["45"] !== undefined)
    parts.push(`FG 45 yd ${fmtNum(m.fg["45"]*100,0)}% (calm ${fmtNum(m.fg_calm["45"]*100,0)}%), 52 yd ${fmtNum(m.fg["52"]*100,0)}% (${fmtNum(m.fg_calm["52"]*100,0)}%)`);
  if (m.comp_pct_delta !== null && m.comp_pct_delta !== undefined) parts.push(`comp% ${fmtSigned(m.comp_pct_delta,1)} pts`);
  if (!parts.length) return "";
  return `<div class="nfl-model" title="Fitted on nflverse ${esc(m.seasons || "")} outdoor games; wind magnitude only">📐 <b>Model</b> · ${parts.join(" · ")}</div>`;
}

function renderCard(g) {
  const rank = g.worst_rank || 0;
  const levelChip = g.level ? `<span class="level-chip">${esc(g.level)}</span>` : "";
  const confLine = g.conf ? ` · ${esc(g.conf)}` : "";

  let body = "";
  if (g.severe && g.severe.length) {
    body += g.severe.map(a => `<div class="severe-banner">🚨 ${esc(a.event)} — ${esc(a.headline)}</div>`).join("");
  }
  if (g.stale) {
    const f = (g.forecast_meta || {}).fetched_at;
    const at = f ? fmtClock(f, zoneFor(g)) : null;
    body += `<div class="stale-note" title="The latest forecast fetch for this game failed; this is the last good read.">⚠️ Last good forecast${at ? " from " + esc(at) : ""} — latest fetch failed, retrying</div>`;
  }
  if (g.roof_note && !g.indoor && !g.no_data) {
    // Retractable roof (2026-10-08): the same caveat the alerts and /weather carry.
    body += `<div class="roof-note">🏟️ Roof: ${esc(g.roof_note)}</div>`;
  }
  if (g.indoor) {
    body += `<div class="no-data-note">🏟️ ${esc(g.no_data || "Indoor / dome")}</div>`;
  } else if (g.no_data) {
    body += `<div class="no-data-note">ℹ️ ${esc(g.no_data)}</div>`;
  } else {
    if (g.impact) {
      body += renderImpactBox(g);
    } else {
      body += renderSnapshot(g);
      body += renderFieldOrientation(g);
      body += renderNflModel(g);
    }
    if (isLive(g) && (!g.hours || !g.hours.length)) {
      body += `<div class="no-data-note">⏱ Final stretch — no forecast hours left in this game.</div>`;
    } else if (g.tiers && g.tiers.length) {
      body += `<div class="tier-list">` + g.tiers.map(t => {
        const r = Math.min(4, Math.max(1, t.rank || TIER_RANK_JS[t.key] || 3));
        return `<div class="tier-row r${r}"><span class="tier-badge-inline">${t.emoji} ${esc(t.label)}</span>` +
               `<div class="tier-impact">${esc(t.impact || t.reason)}</div></div>`;
      }).join("") + `</div>`;
    } else {
      body += `<div class="clear-note">✅ No thresholds crossed</div>`;
    }
    body += renderChanges(g);
    body += renderHourly(g);
  }

  return `<div class="game-card ${severityClass(rank)}">
    <div class="card-head">
      <div class="matchup">${esc(g.away)} @ ${esc(g.home)}${levelChip}${liveChip(g)}</div>
      <div class="venue-line"><span>${esc(g.venue)}${confLine}</span><span class="kickoff">${esc(fmtKickoff(g))}</span></div>
      ${renderParkFactorLine(g)}
    </div>
    <div class="card-body">${body}</div>
  </div>`;
}

function render() {
  const search = document.getElementById('searchBox').value.trim().toLowerCase();
  const hideClear = document.getElementById('hideClear').checked;
  const hideIndoor = document.getElementById('hideIndoor').checked;
  let games = visibleGames(currentPage, Date.now());

  if (search) {
    games = games.filter(g => (g.away+" "+g.home+" "+g.venue).toLowerCase().includes(search));
  }
  if (hideClear) {
    games = games.filter(g => (g.worst_rank || 0) > 0 || g.no_data);
  }
  if (hideIndoor) {
    games = games.filter(g => !g.indoor);
  }

  // Always sort client-side, so the order is right no matter which order
  // the JSON arrived in. TBD kickoffs go last.
  const t = g => { const d = parseUtc(g.game_time_utc); return d ? d.getTime() : Infinity; };
  if (sortChoice === "severity") {
    games.sort((a, b) => (b.worst_rank || 0) - (a.worst_rank || 0) || t(a) - t(b));
  } else {
    games.sort((a, b) => t(a) - t(b) || (b.worst_rank || 0) - (a.worst_rank || 0));
  }

  const grid = document.getElementById('grid');
  if (!games.length) {
    grid.innerHTML = `<div class="empty">No games match the current filters.</div>`;
    return;
  }
  if (sortChoice !== "time") {
    grid.innerHTML = games.map(renderCard).join("");
    return;
  }
  // Day headers in the selected zone (a late West Coast kickoff can land on
  // the next day in Eastern). With "Venue local" each game uses its own zone.
  let html = "", lastDay = null;
  const counts = {};
  games.forEach(g => { const k = dayKey(g); counts[k] = (counts[k] || 0) + 1; });
  for (const g of games) {
    const k = dayKey(g);
    if (k !== lastDay) {
      const n = counts[k];
      html += `<div class="day-header">${esc(dayLabel(g))}<small>${n} game${n === 1 ? "" : "s"}</small></div>`;
      lastDay = k;
    }
    html += renderCard(g);
  }
  grid.innerHTML = html;
}

function selectPage(key) {
  currentPage = key;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.page === key));
  render();
}

function initTabCounts() {
  const now = Date.now();
  PAGE_META.forEach(([key]) => {
    const el = document.getElementById('count-' + key);
    if (el) el.textContent = visibleGames(key, now).length;
  });
}

function showStatus(msg) {
  const b = document.getElementById('statusBanner');
  if (!msg) { b.classList.remove('show'); b.textContent = ""; return; }
  b.textContent = msg;
  b.classList.add('show');
}

async function loadData() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true;
  btn.classList.add('spinning');
  try {
    const resp = await fetch(API_URL, { cache: "no-store" });
    if (!resp.ok) throw new Error(`Server returned ${resp.status}`);
    DATA = await resp.json();
    showStatus(null);
    clientLastUpdated = new Date();
    renderGeneratedAt();
    renderLastUpdated();
    initTabCounts();
    render();
  } catch (err) {
    showStatus(`⚠️ Couldn't load weather data (${err.message}). Showing the last successful load, if any.`);
    console.error(err);
  } finally {
    btn.disabled = false;
    btn.classList.remove('spinning');
  }
}

function refreshData() { loadData(); }

// Auto-refresh (2026-10-08): re-read /api/weather every 5 min while a game is
// live or about to start (weather_data.py rebuilds every 10 min then), every
// 15 min otherwise; re-render every minute so played hours and finished
// games drop off between reads. Paused while the tab is hidden.
const POLL_LIVE_MS = 5 * 60e3, POLL_IDLE_MS = 15 * 60e3, PRUNE_MS = 60e3;
function anyActive(now) {
  return Object.values(DATA.buckets || {}).some(games => (games || []).some(g => {
    if (isOver(g, now)) return false;
    if (isLive(g)) return true;
    const s = startMs(g);
    return s !== null && s - 30 * 60e3 <= now && now <= (projectedEndMs(g) || s) + 30 * 60e3;
  }));
}
let pollTimer = null;
function schedulePoll() {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    if (!document.hidden) await loadData();
    schedulePoll();
  }, anyActive(Date.now()) ? POLL_LIVE_MS : POLL_IDLE_MS);
}
setInterval(() => { if (!document.hidden) { initTabCounts(); render(); } }, PRUNE_MS);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  const stale = !clientLastUpdated || Date.now() - clientLastUpdated.getTime() > POLL_LIVE_MS;
  if (stale) loadData().then(schedulePoll); else { initTabCounts(); render(); }
});

initTimezoneSelect();
selectPage(currentPage);
loadData().then(schedulePoll);

// ── THEME (Whizkid Automations: Ledger light by default, navy night on request) ──
document.getElementById('theme-btn').addEventListener('click',()=>{
  const root=document.documentElement;
  const cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const nx=cur==='dark'?'light':'dark';
  root.setAttribute('data-theme',nx);
  try{localStorage.setItem('wk-theme',nx);}catch(e){}
});
